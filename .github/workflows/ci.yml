name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python — planner tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install planner dependencies
        run: pip install pytest pydantic pyyaml python-dotenv structlog

      - name: Planner unit tests
        working-directory: projects/jira/xray-regression-planner
        run: python -m pytest tests/ -q

      # Catches a syntax error anywhere in the tree, including the CI helpers
      # and menu tools that have no tests of their own.
      - name: Compile every Python file
        run: python -m compileall -q projects scripts desktop tools

  config:
    name: Configuration — YAML validity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pyyaml

      - name: Validate config and pipeline YAML
        run: |
          python - <<'PY'
          import glob, sys, yaml
          failed = False
          for path in sorted(glob.glob('config/*.yaml')) + ['.gitlab-ci.yml']:
              try:
                  yaml.safe_load(open(path))
                  print(f'  OK   {path}')
              except Exception as exc:
                  print(f'  FAIL {path}: {exc}')
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  typescript:
    name: TypeScript — typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - projects/jira/testCaseFullMeal
          - projects/jira/testExecutioner
          - projects/api-automation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Jira tools compile the shared client from ../shared, so its
      # dependencies have to be resolvable even though it is not a workspace.
      - name: Install shared client dependencies
        run: npm install --no-audit --no-fund
        working-directory: projects/jira/shared

      - name: Install
        working-directory: ${{ matrix.project }}
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: ${{ matrix.project }}
        run: npx tsc --noEmit

  sanitization:
    name: Sanitization — no real identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # This repository is generic by construction. The check is here so that
      # stays true as it changes, rather than depending on anyone remembering.
      - name: Scan for real brands, hosts and credentials
        run: |
          set +e
          fail=0

          # --exclude=ci.yml so this check's own pattern text (which necessarily
          # spells out the codename it's looking for) never flags itself.
          check() {
            local label="$1"; shift
            local hits
            hits=$(grep -rEin "$1" --exclude-dir=.git --exclude-dir=node_modules --exclude=ci.yml . | grep -viE "${2:-__never__}")
            if [ -n "$hits" ]; then
              echo "::error::$label"
              echo "$hits" | head -10
              fail=1
            fi
          }

          check "Real brand or legal-entity name" \
            "buffalo wild|arby|dunkin|inspire brands|america's drive" "nearby"
          check "Hardcoded personal filesystem path" \
            "C:\\\\Users\\\\[a-z]" "youruser"
          check "Issue key outside the fictional range" \
            "\b[Tt][Ee]-(1[1-9][0-9]{3}|10[2-9][0-9]{2}|[2-9][0-9]{4,})\b"
          check "Possible private key" \
            "BEGIN [A-Z ]*PRIVATE KEY"
          # The internal codename this repo genericizes away from. Excludes
          # "template"/"boilerplate" (no word boundary) and two placeholder
          # test-fixture values ("plate master" as a card name, "Plate" as a
          # guest first name) that aren't project references.
          check "Internal codename instead of the generic project name" \
            "\bplate\b" "plate master|guest_first_name"

          [ $fail -eq 0 ] && echo "No real identifiers found."
          exit $fail
