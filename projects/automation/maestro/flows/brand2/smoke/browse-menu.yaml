# ─────────────────────────────────────────────────────────────────
#  B2 — Smoke: Browse Menu
#
#  Launches app, selects a store, navigates to Menu tab, and
#  verifies menu categories are visible.
#
#  Run:  maestro test flows/b2/smoke/browse-menu.yaml
# ─────────────────────────────────────────────────────────────────

appId: ${BUNDLE_ID}
tags:
  - smoke
  - b2
  - menu

env:
  BUNDLE_ID: com.example.brand2.uat
  LOCATION_QUERY: "00000"
  LOCATION_ID: "2000"

---

# Launch app & dismiss dialogs
- runFlow: ../../../shared/launch-and-dismiss.yaml

# Dismiss "Close modal" if tech difficulties appear
- runFlow:
    when:
      visible: "Close modal"
    commands:
      - tapOn: "Close modal"
      - waitForAnimationToEnd:
          timeout: 5000

# Search & select store
- runFlow: ../../../shared/select-location.yaml

# Navigate to Menu tab
- tapOn:
    id: "TabBar.Menu.label"
    optional: true
- tapOn:
    text: "Menu"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000

# Verify menu categories load - B2 specific categories
- runFlow:
    when:
      visible: "Featured"
    commands:
      - assertVisible: "Featured"

- runFlow:
    when:
      visible: "Wings"
    commands:
      - assertVisible: "Wings"

- runFlow:
    when:
      visible: "Tenders"
    commands:
      - assertVisible: "Tenders"

- runFlow:
    when:
      visible: "Drinks"
    commands:
      - assertVisible: "Drinks"

- takeScreenshot: screenshots/b2_menu_categories_${output.RUN_ID}

# Tap into a category to verify items load
- runFlow:
    when:
      visible: "Wings"
    commands:
      - tapOn: "Wings"
      - waitForAnimationToEnd:
          timeout: 10000
      - takeScreenshot: screenshots/b2_menu_wings_${output.RUN_ID}

- evalScript: ${console.log('PASSED - B2 browse menu smoke test')}
