# ─────────────────────────────────────────────────────────────────
#  Brand Three — Smoke: Store Search
#
#  Verifies store search by zip code returns results and a
#  store can be selected.
#
#  Run:  maestro test flows/brand3/smoke/store-search.yaml
# ─────────────────────────────────────────────────────────────────

appId: ${BUNDLE_ID}
tags:
  - smoke
  - brand3
  - store

env:
  BUNDLE_ID: com.example.brand3.uat
  LOCATION_QUERY: "00000"
  LOCATION_ID: "1000"

---

# Launch app & dismiss dialogs
- runFlow: ../../../shared/launch-and-dismiss.yaml

# Search for store
- runFlow: ../../../shared/select-location.yaml

# Verify we landed on the menu / store page
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/brand3_store_selected_${output.RUN_ID}
