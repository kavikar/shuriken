# ─────────────────────────────────────────────────────────────────
#  Brand Three — Smoke: Tab Bar Navigation
#
#  Verifies all bottom tab bar items are tappable and navigate
#  to their respective screens.
#
#  Run:  maestro test flows/brand3/smoke/tab-navigation.yaml
# ─────────────────────────────────────────────────────────────────

appId: ${BUNDLE_ID}
tags:
  - smoke
  - brand3
  - navigation

env:
  BUNDLE_ID: com.example.brand3.uat

---

# Launch app & dismiss dialogs
- runFlow: ../../../shared/launch-and-dismiss.yaml

# Wait for home screen
- extendedWaitUntil:
    visible: "Order Now"
    timeout: 20000

# ── Tab 1: Menu ──
- tapOn:
    id: "TabBar.Menu.label"
    optional: true
- tapOn:
    text: "Menu"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/brand3_tab_menu_${output.RUN_ID}

# ── Tab 2: Deals / Loyalty ──
- tapOn:
    id: "TabBar.LoyaltyStackRoot.label"
    optional: true
- tapOn:
    text: "Deals"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/brand3_tab_deals_${output.RUN_ID}

# ── Tab 3: Orders ──
- tapOn:
    id: "TabBar.Orders.label"
    optional: true
- tapOn:
    text: "Orders"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/brand3_tab_orders_${output.RUN_ID}

# ── Tab 4: Bag ──
- tapOn:
    id: "TabBar.Bag.label"
    optional: true
- tapOn:
    text: "Bag"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/brand3_tab_bag_${output.RUN_ID}

# ── Return to Home ──
- tapOn:
    id: "TabBar.Home.label"
    optional: true
- tapOn:
    text: "Home"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

- evalScript: ${console.log('PASSED - Brand Three tab navigation smoke test')}
