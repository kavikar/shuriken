# ═══════════════════════════════════════════════════════════════
#  Brand Three — Guest Pickup Order (Credit Card)
#
#  Full critical-path E2E test:
#    Launch → Select Store → Menu → Add Item → Bag →
#    Checkout → Select Stall → Guest Contact Info →
#    Credit Card Payment → Place Order → Verify Confirmation
#
#  Run:
#    maestro test flows/brand3/order/guest-pickup-order.yaml
# ═══════════════════════════════════════════════════════════════

appId: ${BUNDLE_ID}
tags:
  - e2e
  - brand3
  - guest
  - pickup
  - order
  - critical-path

env:
  BUNDLE_ID: com.example.brand3.uat
  LOCATION_QUERY: "00000"
  LOCATION_ID: "1000"
  MENU_CATEGORY_ID: "Breakfast"
  PRODUCT_CATEGORY: "NationalBreakfastEntrees"
  PRODUCT_ID: "BaconBreakfastBurrito"
  GUEST_FIRST_NAME: "Plate"
  GUEST_LAST_NAME: "SmokeTester"
  GUEST_EMAIL: "user@example.com"
  GUEST_PHONE: "5555550100"
  CC_NAME: "plate master"
  TEST_CC_NUMBER: "5555555555554444"
  TEST_CC_EXPIRY: "0233"
  TEST_CC_CVV: "444"
  TEST_CC_ZIP: "00000"

---

# ══════════════════════════════════════════════════════════════
# STEP 1: Launch App & Dismiss Dialogs
# ══════════════════════════════════════════════════════════════
- runFlow: ../../../shared/launch-and-dismiss.yaml

- takeScreenshot: screenshots/B3_GuestOrder_S01_Home_${output.RUN_ID}

# ══════════════════════════════════════════════════════════════
# STEP 2: Select Pickup Location (Store 1000)
# ══════════════════════════════════════════════════════════════
- runFlow: ../../../shared/select-location.yaml

- takeScreenshot: screenshots/B3_GuestOrder_S02_Location_${output.RUN_ID}

# ══════════════════════════════════════════════════════════════
# STEP 3: Select Category & Add Item to Bag
# ══════════════════════════════════════════════════════════════
- runFlow: ../../../shared/menu-add-item.yaml

- takeScreenshot: screenshots/B3_GuestOrder_S03_ItemAdded_${output.RUN_ID}

# ══════════════════════════════════════════════════════════════
# STEP 4: Open Bag & Start Checkout
# ══════════════════════════════════════════════════════════════
- runFlow: ../../../shared/open-bag-checkout.yaml

- takeScreenshot: screenshots/B3_GuestOrder_S04_Checkout_${output.RUN_ID}

# ══════════════════════════════════════════════════════════════
# STEP 5: Select Stall Pickup Option
# ══════════════════════════════════════════════════════════════
- runFlow:
    when:
      visible:
        id: "Bag.Checkout.PickupLocation.Stall"
    commands:
      - tapOn:
          id: "Bag.Checkout.PickupLocation.Stall"
      - waitForAnimationToEnd:
          timeout: 5000

- takeScreenshot: screenshots/B3_GuestOrder_S05_Stall_${output.RUN_ID}

# ══════════════════════════════════════════════════════════════
# STEP 6: Fill Guest Contact Info
# ══════════════════════════════════════════════════════════════
- runFlow: ../../../shared/fill-guest-contact.yaml

- takeScreenshot: screenshots/B3_GuestOrder_S06_ContactInfo_${output.RUN_ID}

# ══════════════════════════════════════════════════════════════
# STEP 7: Pay with Credit Card
# ══════════════════════════════════════════════════════════════
- runFlow: ../../../shared/pay-credit-card.yaml

- takeScreenshot: screenshots/B3_GuestOrder_S07_Payment_${output.RUN_ID}

# ══════════════════════════════════════════════════════════════
# STEP 8: Place Order & Verify Confirmation
# ══════════════════════════════════════════════════════════════
- runFlow: ../../../shared/place-order-verify.yaml

- takeScreenshot: screenshots/B3_GuestOrder_S08_Confirmed_${output.RUN_ID}

- evalScript: ${console.log('PASSED - Brand Three Guest Pickup Order with Credit Card')}

# ══════════════════════════════════════════════════════════════
# CLEANUP: Stop app
# ══════════════════════════════════════════════════════════════
- stopApp
