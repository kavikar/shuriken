# ─────────────────────────────────────────────────────────────────
#  Brand One — Smoke: Browse Menu
#
#  Launches app, selects a store, navigates to Menu tab, and
#  verifies menu categories are visible.
#
#  Run:  maestro test flows/brand1/smoke/browse-menu.yaml
# ─────────────────────────────────────────────────────────────────

appId: ${BUNDLE_ID}
tags:
  - smoke
  - Brand One
  - menu

env:
  BUNDLE_ID: com.example.brand1.uat
  LOCATION_QUERY: "00000"
  LOCATION_ID: "1000"

---

# Launch app & dismiss dialogs
- runFlow: ../../../shared/launch-and-dismiss.yaml

# Dismiss "Close modal" if tech difficulties appear
- runFlow:
    when:
      visible: "Close modal"
    commands:
      - tapOn: "Close modal"
      - waitForAnimationToEnd:
          timeout: 5000

# Search & select store
- runFlow: ../../../shared/select-location.yaml

# Navigate to Menu tab
- tapOn:
    id: "TabBar.Menu.label"
    optional: true
- tapOn:
    text: "Menu"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000

# Verify menu categories load
- runFlow:
    when:
      visible: "Featured"
    commands:
      - assertVisible: "Featured"

- runFlow:
    when:
      visible: "Sandwiches"
    commands:
      - assertVisible: "Sandwiches"

- runFlow:
    when:
      visible: "Sides"
    commands:
      - assertVisible: "Sides"

- runFlow:
    when:
      visible: "Drinks"
    commands:
      - assertVisible: "Drinks"

- takeScreenshot: screenshots/Brand One_menu_categories_${output.RUN_ID}

# Tap into a category to verify items load
- runFlow:
    when:
      visible: "Sandwiches"
    commands:
      - tapOn: "Sandwiches"
      - waitForAnimationToEnd:
          timeout: 10000
      - takeScreenshot: screenshots/Brand One_menu_sandwiches_${output.RUN_ID}

- evalScript: ${console.log('PASSED - Brand One browse menu smoke test')}
